[workspace]
authors = ["ben <ben.uzh@proton.me>"]
channels = ["conda-forge", "bioconda"]
name = "rcppml"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
check = "Rscript check.R"
export-env = "pixi workspace export conda-environment --name $(basename $(git rev-parse --show-toplevel)) envs/rcppml.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/rcppml.yml"

# No r-rcppml here on purpose: conda-forge stops at 0.3.7.1, which predates
# svd()/pca() and the lanczos/krylov backends entirely. These are the toolchain
# it needs; src/rcppml.R builds the pinned 1.0.0 commit on first use.
[dependencies]
r-base = ">=4.5,<4.6"
r-matrix = "*"
r-rcpp = "*"
r-rcppeigen = "*"
r-remotes = "*"
r-argparser = "*"
r-jsonlite = "*"
"r-data.table" = "*"
bioconductor-hdf5array = "*"
bioconductor-rhdf5 = "*"
c-compiler = "*"
cxx-compiler = "*"
make = "*"
git = "*"
