[workspace]
authors = ["ben <ben.uzh@proton.me>"]
channels = ["https://prefix.dev/almost-conductor", "conda-forge", "bioconda"]
name = "rcppml"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
check = "Rscript check.R"
export-env = "pixi workspace export conda-environment --name $(basename $(git rev-parse --show-toplevel)) envs/rcppml.yml && sed -i '1s/^/# this file was auto-generated by pixi - do not edit by hand\\n/' envs/rcppml.yml"

# conda-forge stops at r-rcppml 0.3.7.1, which predates svd()/pca() and the
# lanczos/krylov backends entirely. 1.0.0 comes from the almost-conductor
# channel, first in the channel list above.
[dependencies]
r-rcppml = ">=1.0.0"
r-base = ">=4.5,<4.6"
r-matrix = "*"
r-argparser = "*"
r-jsonlite = "*"
"r-data.table" = "*"
bioconductor-hdf5array = "*"
bioconductor-rhdf5 = "*"
