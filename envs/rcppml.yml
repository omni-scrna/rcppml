---
# RcppML module env.
#
# No r-rcppml here on purpose: conda-forge stops at 0.3.7.1, which predates
# svd()/pca() and the lanczos/krylov backends. The env ships the toolchain and
# src/rcppml.R installs the pinned 1.0.0 commit from GitHub on first use.
name: rcppml
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - r-base >=4.5,<4.6
  - r-matrix
  - r-rcpp
  - r-rcppeigen
  - r-remotes
  - r-argparser
  - r-jsonlite
  - r-data.table
  - bioconductor-hdf5array
  - bioconductor-rhdf5
  - c-compiler
  - cxx-compiler
  - make
  - git
